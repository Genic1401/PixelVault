workflows:
  pixelvault-android:
    name: PixelVault Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: com.genic.pixelvault
    scripts:
      - name: Generate Android platform scaffold without replacing app source
        script: |
          flutter create --platforms android --org com.genic.pixelvault --project-name pixelvault /tmp/pixelvault_scaffold
          rm -rf android
          cp -R /tmp/pixelvault_scaffold/android ./android
      - name: Resolve packages
        script: flutter pub get
      - name: Generate launcher and splash assets
        script: dart run flutter_launcher_icons && dart run flutter_native_splash:create
      - name: Run tests
        script: flutter test
      - name: Analyze
        script: flutter analyze
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/**/outputs/**/*.aab
      - flutter_drive.log
