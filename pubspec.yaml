name: pixelvault
description: PixelVault - Mask, transfer and preserve files.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^12.2.0
  share_plus: ^13.3.1
  flutter_svg: ^2.0.10+1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  crypto: ^3.0.6
  archive: ^4.0.2
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  uuid: ^4.5.1
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/brand/
    - assets/images/
    - assets/icons/
    - assets/icons/svg/
    - assets/icons/3d/

flutter_launcher_icons:
  android: true
  image_path: assets/images/brand/app_logo.png
  adaptive_icon_background: '#FFC900'
  adaptive_icon_foreground: assets/images/brand/app_logo.png

flutter_native_splash:
  color: '#FFFFFF'
  image: assets/images/brand/app_logo.png
  android: true
  ios: false
